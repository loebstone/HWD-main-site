openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: HWD Main Site private family API
servers:
  - url: /api
paths:
  /auth/view-as-member:
    post:
      operationId: setViewAsMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberViewInput" }
      responses:
        "200":
          description: Effective session identity after changing member view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "403": { description: Administrator access required }
  /admin/home-display:
    get:
      operationId: getHomeDisplay
      responses:
        "200":
          description: Home display settings for administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeDisplay" }
    put:
      operationId: updateHomeDisplay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeDisplay" }
      responses:
        "200":
          description: Saved Home display settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeDisplay" }
  /admin/dues:
    get:
      operationId: getDuesSettings
      responses:
        "200":
          description: Administrator dues settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesSettings" }
    put:
      operationId: updateDuesSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuesSettings" }
      responses:
        "200":
          description: Saved dues settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesSettings" }
  /dues:
    get:
      operationId: getDues
      responses:
        "200":
          description: Member dues instructions; text withheld when season is closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesSettings" }
  /suite/menu:
    get:
      operationId: getSuiteMenu
      responses:
        "200":
          description: Public navigation only; public max-age 300; restricted GET CORS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuiteMenu" }
  /admin/suite-menu:
    get:
      operationId: getAdminSuiteMenu
      responses:
        "200":
          description: Admin menu settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuiteMenu" }
    put:
      operationId: updateSuiteMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuiteMenuInput" }
      responses:
        "200":
          description: Saved menu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuiteMenu" }
  /contact:
    get:
      operationId: getContactStatus
      responses:
        "200":
          description: Availability only; never discloses recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactStatus" }
    post:
      operationId: sendContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: Sent (logged only in development)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "409": { description: Contact not configured }
        "429": { description: Daily limit reached }
  /admin/contact:
    get:
      operationId: getAdminContact
      responses:
        "200":
          description: Admin-only recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSettings" }
    put:
      operationId: updateContactSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSettings" }
      responses:
        "200":
          description: Saved recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSettings" }
  /auth/roster-entry:
    get:
      operationId: getRosterEntry
      parameters:
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Validated Roster entry URL with site origin and return path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUrl" }
        "400": { description: Invalid path or missing configuration }
  /auth/roster-sign-out:
    get:
      operationId: getRosterSignOut
      responses:
        "200":
          description: Roster sign-out URL offered after ending the local session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUrl" }
  /auth/sso:
    servers: [{ url: / }]
    get:
      operationId: redeemSso
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "303": { description: Session cookie set; redirect to validated local path }
        "400": { description: Invalid local return path }
        "401": { description: Ticket refused or Roster unavailable; plain refusal page }
        "429": { description: Too many attempts; refusal page }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/link:
    post:
      operationId: requestSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailInput" }
      responses:
        "200":
          description: Always neutral
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/verify:
    get:
      operationId: getVerificationGate
      responses:
        "200":
          description: Rate-limited continue-page check; never consumes a token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    post:
      operationId: verifySignIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
  /auth/sign-out:
    post:
      operationId: signOut
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /public/home-notice:
    get:
      operationId: getPublicHomeNotice
      responses:
        "200":
          description: Public notice text only; never returns signed-in-only notice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNotice" }
        "204": { description: No public notice is configured }
  /home:
    get:
      operationId: getHome
      responses:
        "200":
          description: Private home summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeSummary" }
  /groups:
    get:
      operationId: listDocumentGroups
      responses:
        "200":
          description: Only groups visible to this identity, with live summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentGroup" } }
  /groups/{slug}:
    get:
      operationId: getDocumentGroup
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Group and visible live documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDocuments" }
        "404": { description: Missing or not visible }
  /admin/groups:
    post:
      operationId: createDocumentGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGroup" }
  /admin/groups/{id}:
    patch:
      operationId: updateDocumentGroup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentGroup" }
  /admin/groups/{id}/retire:
    post:
      operationId: retireDocumentGroup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "409": { description: Group still holds live documents }
  /documents/move:
    post:
      operationId: moveDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentMoveInput" }
      responses:
        "200":
          description: Moved atomically and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/home:
    get:
      operationId: getHomeGroups
      responses:
        "200":
          description: Featured group selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeGroups" }
    put:
      operationId: updateHomeGroups
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeGroups" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeGroups" }
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - { name: section, in: query, schema: { $ref: "#/components/schemas/Section" } }
        - { name: includeRetired, in: query, schema: { type: boolean } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      operationId: createLinkDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Created link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/upload:
    post:
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileInput" }
      responses:
        "201":
          description: Uploaded PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}:
    patch:
      operationId: updateDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}/replace:
    post:
      operationId: replaceDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileInput" }
      responses:
        "201":
          description: New version; previous version retained and retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /documents/{id}/retire:
    post:
      operationId: retireDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /documents/{id}/open:
    get:
      operationId: openDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authenticated PDF stream; no-store; inline disposition
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "302": { description: Audited external-link redirect }
        "401": { description: Authentication required }
  /announcements:
    get:
      operationId: listAnnouncements
      parameters:
        - { name: showPast, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Live announcements, optionally including past entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
    post:
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
  /announcements/{id}/retire:
    post:
      operationId: retireAnnouncement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Retired, retained in the database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /apps:
    get:
      operationId: getAppLinks
      responses:
        "200":
          description: App links permitted for the signed-in role
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppLink" } }
  /admin/home-notice:
    get:
      operationId: getHomeNotice
      responses:
        "200":
          description: Current notice and visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeNotice" }
    put:
      operationId: updateHomeNotice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeNoticeInput" }
      responses:
        "200":
          description: Updated notice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeNotice" }
  /admin/apps:
    get:
      operationId: getAdminAppLinks
      responses:
        "200":
          description: All editable app links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppLink" } }
    put:
      operationId: updateAppLinks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLinksInput" }
      responses:
        "200":
          description: Saved app links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppLink" } }
  /admin/audit:
    get:
      operationId: listAuditLog
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: personId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/AuditAction" } }
      responses:
        "200":
          description: Read-only page of newest audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
  /admin/grants:
    get:
      operationId: listGrants
      responses:
        "200":
          description: Historical grants, never a member directory
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    post:
      operationId: createGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "201":
          description: Grant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
  /admin/grants/{id}/end:
    post:
      operationId: endGrant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Grant ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/old-site-import:
    get:
      operationId: getOldSiteImport
      responses:
        "200":
          description: Last import or dry run, visible only to admins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OldSiteImportRun" }
        "204":
          description: No run yet
    post:
      operationId: startOldSiteImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OldSiteImportInput" }
      responses:
        "202":
          description: Run started; poll GET for progress and results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OldSiteImportRun" }
        "409":
          description: A run is already in progress
components:
  schemas:
    AuthUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    OldSiteImportInput:
      type: object
      required: [dryRun]
      properties:
        dryRun: { type: boolean }
    OldSiteImportRow:
      type: object
      required: [sheetId, title, section, result, reason]
      properties:
        sheetId: { type: string }
        title: { type: string }
        section: { type: string }
        result: { type: string, enum: [would import, imported, already imported, skipped, failed] }
        reason: { type: string }
    OldSiteImportRun:
      type: object
      required: [id, dryRun, status, startedAt, updatedAt, finishedAt, actorPersonId, actorName, totalRows, rows, error, sourceHash]
      properties:
        id: { type: string }
        dryRun: { type: boolean }
        status: { type: string, enum: [running, completed, failed, interrupted] }
        startedAt: { type: string }
        updatedAt: { type: string }
        finishedAt: { type: [string, "null"] }
        actorPersonId: { type: string }
        actorName: { type: string }
        totalRows: { type: integer }
        rows: { type: array, items: { $ref: "#/components/schemas/OldSiteImportRow" } }
        error: { type: [string, "null"] }
        sourceHash: { type: [string, "null"] }
    HealthStatus:
      type: object
      required: [status, build]
      properties:
        status: { type: string }
        build: { type: string, description: "API bundle build identifier (UTC timestamp plus random suffix); source-unbundled in source-mode tests" }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    EmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 320 }
    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
    Identity:
      type: object
      required: [personId, displayName, goesBy, role]
      properties:
        personId: { type: string }
        displayName: { type: string }
        goesBy: { type: ["string", "null"] }
        role: { type: string, enum: [member, editor, admin] }
        viewAsMember: { type: boolean, default: false }
        apps:
          type: [array, "null"]
          items: { type: string }
          description: Null or absent means legacy session; empty array is an explicit lack of tool access
    SuiteItem:
      type: object
      required: [id, label, href, order]
      properties:
        id: { type: string }
        label: { type: string, minLength: 1, maxLength: 100 }
        href: { type: string, format: uri, maxLength: 2048 }
        order: { type: integer, minimum: 0, maximum: 100 }
    SuiteTool:
      type: object
      required: [id, label, href]
      properties:
        id: { type: string }
        label: { type: string, minLength: 1, maxLength: 100 }
        href: { type: string, format: uri, maxLength: 2048 }
    SuiteMenuInput:
      type: object
      required: [items, tools]
      properties:
        items: { type: array, minItems: 6, maxItems: 6, items: { $ref: "#/components/schemas/SuiteItem" } }
        tools: { type: array, minItems: 2, maxItems: 2, items: { $ref: "#/components/schemas/SuiteTool" } }
    SuiteMenu:
      type: object
      required: [version, logoSvg, items, tools, signOutHref]
      properties:
        version: { type: integer }
        logoSvg: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SuiteItem" } }
        tools: { type: array, items: { $ref: "#/components/schemas/SuiteTool" } }
        signOutHref: { type: string, format: uri }
    ContactInput:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 5000 }
    ContactSettings:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string, maxLength: 320, description: Empty string disables Contact }
    ContactStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    Section:
      type: string
      enum: [shareholders, directors, governing, logging, photo_archive]
    LegacySection:
      type: [string, "null"]
      enum: [shareholders, directors, governing, logging, photo_archive, null]
    GroupInput:
      type: object
      required: [name, description, sortOrder, layout, visibility]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        slug: { type: string, maxLength: 180 }
        description: { type: string, maxLength: 500 }
        sortOrder: { type: integer }
        layout: { type: string, enum: [list, by_year] }
        visibility: { type: string, enum: [everyone, staff] }
    DocumentGroup:
      type: object
      required: [id, name, slug, description, sortOrder, layout, visibility, createdBy, createdAt, retiredAt, documentCount, latestTitle, latestDate]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        layout: { type: string, enum: [list, by_year] }
        visibility: { type: string, enum: [everyone, staff] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        retiredAt: { type: ["string", "null"], format: date-time }
        documentCount: { type: integer }
        latestTitle: { type: ["string", "null"] }
        latestDate: { type: ["string", "null"], format: date-time }
    GroupDocuments:
      type: object
      required: [group, documents]
      properties:
        group: { $ref: "#/components/schemas/DocumentGroup" }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
    DocumentMoveInput:
      type: object
      required: [ids, groupId]
      properties:
        ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
        groupId: { type: string, format: uuid }
    HomeGroups:
      type: object
      required: [groupIds]
      properties:
        groupIds: { type: array, maxItems: 4, items: { type: string, format: uuid } }
    DocumentInput:
      type: object
      required: [title, groupId, type, sortOrder, tags, note]
      properties:
        title: { type: string, minLength: 1, maxLength: 250 }
        groupId: { type: string, format: uuid }
        section: { $ref: "#/components/schemas/LegacySection" }
        year: { type: ["integer", "null"], minimum: 1800, maximum: 2200 }
        type: { type: string, enum: [pdf, link] }
        externalUrl: { type: ["string", "null"], maxLength: 2048 }
        sortOrder: { type: integer }
        tags: { type: array, items: { type: string, maxLength: 80 }, maxItems: 30 }
        note: { type: string, maxLength: 2000 }
    FileInput:
      type: object
      required: [metadata]
      properties:
        metadata: { type: string, description: JSON encoded DocumentInput; file optional only when replacing with a link }
        file: { type: string, format: binary }
    Document:
      type: object
      required: [id, title, groupId, section, year, type, externalUrl, sortOrder, tags, note, uploadedBy, uploadedByName, uploadedAt, retiredAt, replaces]
      properties:
        id: { type: string }
        groupId: { type: ["string", "null"] }
        title: { type: string }
        section: { $ref: "#/components/schemas/LegacySection" }
        year: { type: ["integer", "null"] }
        type: { type: string, enum: [pdf, link] }
        externalUrl: { type: ["string", "null"] }
        sortOrder: { type: integer }
        tags: { type: array, items: { type: string } }
        note: { type: string }
        uploadedBy: { type: string }
        uploadedByName: { type: string }
        uploadedAt: { type: string, format: date-time }
        retiredAt: { type: ["string", "null"], format: date-time }
        replaces: { type: ["string", "null"] }
    HomeSummary:
      type: object
      required: [documentCount, recentDocuments, notice, reminders, apps, featuredGroups]
      properties:
        documentCount: { type: integer }
        featuredGroups: { type: array, items: { $ref: "#/components/schemas/DocumentGroup" } }
        recentDocuments: { type: array, items: { $ref: "#/components/schemas/Document" } }
        notice: { $ref: "#/components/schemas/HomeNotice" }
        reminders: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
        apps: { type: array, items: { $ref: "#/components/schemas/AppLink" } }
        latestMinutes:
          anyOf:
            - { $ref: "#/components/schemas/Document" }
            - { type: "null" }
        slideshowEmbedUrl: { type: ["string", "null"], format: uri }
        familyTime:
          anyOf:
            - { $ref: "#/components/schemas/FamilyTime" }
            - { type: "null" }
        cards: { type: array, items: { $ref: "#/components/schemas/HomeCard" } }
    MemberViewInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    HomeDisplay:
      type: object
      required: [slideshowEmbedUrl]
      properties:
        slideshowEmbedUrl: { type: ["string", "null"], maxLength: 2048 }
    DuesSettings:
      type: object
      required: [seasonOpen, text]
      properties:
        seasonOpen: { type: boolean }
        text: { type: string, maxLength: 10000 }
    HomeCard:
      type: object
      required: [id, label, href]
      properties:
        id: { type: string }
        label: { type: string }
        href: { type: string }
    FamilySlot:
      type: object
      required: [slotNumber, segmentIndex, familyGroupId, familyName, displayColor, startDate, endDate, isManualOverride]
      properties:
        slotNumber: { type: integer }
        segmentIndex: { type: integer }
        familyGroupId: { type: string }
        familyName: { type: string }
        displayColor: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Exclusive end date }
        isManualOverride: { type: boolean }
    FamilyTime:
      type: object
      required: [year, slots, yourFamily, schedulerHref]
      properties:
        year: { type: integer }
        slots: { type: array, items: { $ref: "#/components/schemas/FamilySlot" } }
        yourFamily:
          type: [object, "null"]
          required: [familyGroupId, familyName]
          properties:
            familyGroupId: { type: string }
            familyName: { type: string }
        schedulerHref: { type: string }
    GrantInput:
      type: object
      required: [personId, displayName, role]
      properties:
        personId: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 250 }
        role: { type: string, enum: [editor, admin] }
    Grant:
      type: object
      required: [id, personId, displayName, role, grantedBy, grantedAt, endedAt]
      properties:
        id: { type: string }
        personId: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [editor, admin] }
        grantedBy: { type: string }
        grantedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
    PublicNotice:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 10000 }
    HomeNotice:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, maxLength: 10000 }
        visibility: { type: string, enum: [signed-in, public] }
    HomeNoticeInput:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, maxLength: 10000 }
        visibility: { type: string, enum: [signed-in, public] }
    AppLink:
      type: object
      required: [id, label, url]
      properties:
        id: { type: string, enum: [calendar, roster, forecast, cap-table] }
        label: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
    AppLinksInput:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/AppLink" }
    Announcement:
      type: object
      required: [id, title, body, date, placement, hideAfter, createdBy, createdByName, createdAt, retiredAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        date: { type: string, format: date }
        placement: { type: string, enum: [reminders, announcements, both] }
        hideAfter: { type: string, format: date }
        createdBy: { type: string }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        retiredAt: { type: ["string", "null"], format: date-time }
    AnnouncementInput:
      type: object
      required: [title, body, placement]
      properties:
        title: { type: string, minLength: 1, maxLength: 250 }
        body: { type: string, maxLength: 10000 }
        date: { type: string, format: date }
        placement: { type: string, enum: [reminders, announcements, both] }
        hideAfter: { type: string, format: date }
    AuditAction:
      type: string
      enum: [sign-in, sign-out, document-open, document-upload, document-replace, document-retire, document-edit, document-move, group-create, group-edit, group-retire, home-edit, grant-create, grant-end, announcement-create, announcement-edit, announcement-retire, notice-edit, apps-edit, menu-edit, contact-send, contact-settings-edit, view-as-member-on, view-as-member-off, dues-settings-edit, import]
    AuditEntry:
      type: object
      required: [id, at, actorPersonId, actorName, action, targetId, description, visitorAddress]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorPersonId: { type: string }
        actorName: { type: string }
        action: { $ref: "#/components/schemas/AuditAction" }
        targetId: { type: ["string", "null"] }
        description: { type: string }
        visitorAddress: { type: string }
    AuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
